<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy HotEmin 🔥</title>
  <link rel="icon" href="emin.png" type="image/png">

  <style>
    body { 
      margin:0; background:#000; font-family: Arial; text-align:center; overflow:hidden; position: relative;
    }
    #game-container {
      position: relative;
      margin: 10px auto;
      max-width: 920px;
      z-index: 2;
    }
    canvas { 
      image-rendering: pixelated; 
      border:3px solid #ff0; 
      background:#000; 
      display: block;
      width: 100%;
      height: auto;
      max-height: 85vh;
    }
    h1 { 
      color:#ff0; 
      text-shadow: 0 0 10px #ff0, 0 0 20px #ff4500;
      margin:8px auto; 
      font-size: 32px;
    }

    .side-guy {
      position: absolute;
      z-index: 1;
      image-rendering: pixelated;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    #left-group  { left: 20px; bottom: 100px; width: 160px; }
    #right-group { right: 20px; bottom: 100px; width: 240px; }

    p.instructions {
      color:#ff0; margin:8px auto; font-size:16px; text-shadow: 2px 2px #000;
    }

    button {
      font-size: 28px; padding: 14px 40px; background:#ff0; color:#000; 
      border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
    }

    /* Mobile Game Over Box */
    #ui {
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 20; 
      text-align:center;
      width: 90%;
      max-width: 420px;
    }

    @media (max-width: 1150px) {
      #left-group, #right-group { display: none; }
      h1 { font-size: 28px; }
      p.instructions { font-size: 15px; }
    }

    @media (max-width: 600px) {
      #game-container { margin: 5px auto; }
      canvas { border-width: 2px; }
    }
  </style>
</head>
<body>
  <h1>Flappy HotEmin 🔥</h1>
  <div id="score" style="position:absolute; top:10px; left:10px; color:white; font-size:24px; font-weight:bold; text-shadow:2px 2px #000; z-index:10;">
    Score: 0
  </div>

  <img id="left-group" class="side-guy" src="left-group.png" alt="">
  <img id="right-group" class="side-guy" src="right-group.png" alt="">

  <div id="game-container">
    <canvas id="game" width="900" height="600"></canvas>
  </div>
  
  <p class="instructions">SPACE / TAP / CLICK to Flap • #HotEminSummer</p>

  <div id="ui"></div>

  <script>
    // ... [Keep all your JavaScript exactly the same as before] ...

    function showRestart() {
      const ui = document.getElementById('ui');
      let message = "";
      
      if (lastHitType === "FUDS") {
        message = "Loser!..FUDS caught HOTEMIN 😡";
      } else if (lastHitType === "JEETS") {
        message = "Not worthy.. you are a JEET";
      } else {
        message = "Not worthy.. HOTEMIN fell!";
      }

      ui.innerHTML = `
        <div style="background:#000; border:5px solid #ff0; padding:25px 20px; border-radius:16px;">
          <h2 style="color:white; font-size:24px; margin:10px 0 20px 0; line-height:1.3;">${message}</h2>
          <button onclick="startCountdown()" style="font-size: 32px; padding: 16px 60px; width:100%; max-width:280px;">RESTART</button>
        </div>
      `;
      ui.style.display = 'block';
    }

    // Rest of your script (update, draw, flap, loop, etc.) remains the same
    // Copy the rest of your <script> from the previous working version here
  </script>
</body>
</html>
