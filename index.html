<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy HotEmin 🔥</title>
  <link rel="icon" href="emin.png" type="image/png">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body { 
      background:#000; 
      font-family: Arial; 
      text-align:center; 
      overflow:hidden; 
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    #game-container {
      position: relative;
      margin: 10px auto;
      width: 100%;
      max-width: 920px;
      z-index: 2;
    }
    canvas { 
      image-rendering: pixelated; 
      border:3px solid #ff0; 
      background:#000; 
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
    }

    /* Header Layout */
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 0 auto 8px;
      width: 100%;
      max-width: 920px;
      padding: 0 15px;
      box-sizing: border-box;
    }
    h1 { 
      color:#ff0; 
      text-shadow: 0 0 10px #ff0, 0 0 20px #ff4500;
      margin: 0;
      font-size: 32px;
      text-align: center;
    }
    #score {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 2px 2px #000;
      z-index: 10;
    }

    .side-guy {
      position: absolute;
      z-index: 1;
      image-rendering: pixelated;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    #left-group  { left: 20px; bottom: 100px; width: 160px; }
    #right-group { right: 20px; bottom: 100px; width: 240px; }

    p.instructions {
      color:#ff0; margin: 8px auto 0; font-size:17px; text-shadow: 2px 2px #000;
    }

    button {
      font-size: 28px; padding: 14px 50px; background:#ff0; color:#000; 
      border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
    }

    /* Centered popup UI box */
    #ui {
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 20; 
      text-align: center;
      width: 85%;
      max-width: 420px;
      box-sizing: border-box;
    }

    .ui-card {
      background: #000; 
      border: 5px solid #ff0; 
      padding: 18px 20px; 
      border-radius: 16px;
    }
    .ui-msg {
      color: white; 
      font-size: 21px; 
      margin: 8px 0 16px 0; 
      line-height: 1.3;
    }
    .ui-card button {
      width: 100%;
    }

    /* Tablet Fixes */
    @media (max-width: 1150px) {
      #left-group, #right-group { display: none; }
    }

    /* Mobile Fixes (Phones & Small Screens) */
    @media (max-width: 700px) {
      .header {
        flex-direction: column;
        gap: 4px;
        padding: 0;
      }
      h1 { 
        font-size: 18px; 
        order: 1;
      }
      #score { 
        position: static; 
        transform: none; 
        font-size: 15px; 
        order: 2;
      }
      p.instructions { font-size: 13px; }
      
      #ui { 
        max-width: 250px; 
      }
      .ui-card { 
        padding: 10px 12px; 
        border-width: 3px; 
        border-radius: 10px;
      }
      .ui-msg { 
        font-size: 13px; 
        margin: 4px 0 10px 0; 
      }
      .ui-card button { 
        font-size: 16px; 
        padding: 8px 16px; 
        border-radius: 8px; 
      }
    }

    @media (max-width: 480px) {
      canvas { 
        border-left: none; 
        border-right: none; 
        border-top: 2px solid #ff0; 
        border-bottom: 2px solid #ff0;
      }
      #game-container { margin: 0 auto; }
      #ui { max-width: 220px; } 
    }
  </style>
</head>
<body>
  <div class="header">
    <div id="score">Score: 0</div>
    <h1>Flappy HotEmin 🔥</h1>
  </div>

  <img id="left-group" class="side-guy" src="left-group.png" alt="">
  <img id="right-group" class="side-guy" src="right-group.png" alt="">

  <div id="game-container">
    <canvas id="game" width="900" height="600"></canvas>
  </div>
  
  <p class="instructions">SPACE / TAP / CLICK to Flap • #HotEminSummer</p>

  <div id="ui">
    <button id="playBtn">PLAY</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const padding = window.innerWidth <= 700 ? 0 : 30;
      const maxW = Math.min(window.innerWidth - padding, 900);
      const scale = maxW / 900;
      canvas.style.width = (900 * scale) + "px";
      canvas.style.height = (600 * scale) + "px";
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', resizeCanvas);

    let bird = { x: 180, y: 220, vel: 0, size: 64 };
    let gravity = 0.45, flapStrength = -9.2, maxFallSpeed = 11.5;
    let pipes = [], coins = [], particles = [], score = 0, gameState = 'start', frame = 0, speed = 3.5;
    let lastHitType = "";

    const bgImg = new Image(); bgImg.src = 'background.png';
    const hotEminImg = new Image(); hotEminImg.src = 'emin.png';
    const coinImg = new Image(); coinImg.src = 'coin.png';

    let stars = [];
    function createStars() {
      stars = [];
      for (let i = 0; i < 150; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * 420,
          size: Math.random() * 2.5 + 0.8,
          speed: Math.random() * 0.4 + 0.15,
          twinkle: Math.random() * 0.08 + 0.03
        });
      }
    }
    createStars();

    function drawStars() {
      ctx.save();
      for (let s of stars) {
        const alpha = 0.4 + Math.sin(frame * s.twinkle) * 0.6;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(s.x, s.y, s.size, s.size);
        s.x -= s.speed;
        if (s.x < 0) s.x = canvas.width;
      }
      ctx.restore();
    }

    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSound(type) {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain).connect(audioCtx.destination);
      if (type === 'flap') { osc.type='sawtooth'; osc.frequency.setValueAtTime(750, audioCtx.currentTime); gain.gain.value=0.3; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12); }
      else if (type==='coin') { osc.type='sine'; osc.frequency.setValueAtTime(1400, audioCtx.currentTime); gain.gain.value=0.4; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2); }
      else if (type==='hit') { osc.type='square'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); gain.gain.value=0.6; gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.35); }
      else if (type==='gameover') { osc.type='sine'; osc.frequency.setValueAtTime(450, audioCtx.currentTime); gain.gain.value=0.5; osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime+0.9); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+1); }
      osc.start(); osc.stop(audioCtx.currentTime+1.2);
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 25; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 2.5 + Math.random() * 6;
        particles.push({ x: x+32, y: y+32, vx: Math.cos(angle)*vel, vy: Math.sin(angle)*vel-2,
          life: 45 + Math.random()*30, maxLife: 45 + Math.random()*30,
          size: 4 + Math.random()*8, color: ['#FF4500','#FFD700','#FF0000','#FFA500'][Math.floor(Math.random()*4)]
        });
      }
    }

    function resetGame() {
      bird.y = 220; bird.vel = 0;
      pipes = []; coins = []; particles = [];
      score = 0; frame = 0; speed = 3.5;
      gameState = 'playing';
      document.getElementById('ui').style.display = 'none';
    }

    function startCountdown() {
      let count = 3;
      const ui = document.getElementById('ui');
      ui.innerHTML = `<h2 style="color:#ff0; font-size:36px; margin:0;">${count}</h2>`;
      const timer = setInterval(() => {
        count--;
        if (count > 0) ui.innerHTML = `<h2 style="color:#ff0; font-size:36px; margin:0;">${count}</h2>`;
        else { clearInterval(timer); resetGame(); }
      }, 900);
    }

    function showRestart() {
      const ui = document.getElementById('ui');
      let message = lastHitType === "FUDS" ? "Loser!..FUDS caught HOTEMIN🤬" :
                    lastHitType === "JEETS" ? "Not worthy.. you are a JEET!🔻" :
                    "Are you even hyped enough?.. HOTEMIN fell!";

      ui.innerHTML = `
        <div class="ui-card">
          <h2 class="ui-msg">${message}</h2>
          <button id="restartBtn">RESTART</button>
        </div>
      `;
      
      document.getElementById('restartBtn').addEventListener('click', () => {
        initAudio();
        startCountdown();
      });
      
      ui.style.display = 'block';
    }

    function update() {
      if (gameState !== 'playing') return;
      frame++;
      bird.vel += gravity;
      if (bird.vel > maxFallSpeed) bird.vel = maxFallSpeed;
      bird.y += bird.vel;

      if (bird.y + bird.size > 515 || bird.y < -30) {
        gameState = 'gameover';
        createExplosion(bird.x, bird.y);
        playSound('gameover');
        lastHitType = "GROUND";
        showRestart();
      }

      if (frame % 110 === 0) {
        let gap = 195;
        let top = Math.random() * (canvas.height - gap - 220) + 90;
        pipes.push({ x: canvas.width, top: top, bottom: top + gap, passed: false });
      }
      if (frame % 65 === 0) coins.push({ x: canvas.width + 20, y: Math.random() * 340 + 110 });

      pipes.forEach(p => p.x -= speed);
      coins.forEach(c => c.x -= speed);
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.life--; });

      pipes = pipes.filter(p => p.x > -100);
      coins = coins.filter(c => c.x > -60);
      particles = particles.filter(p => p.life > 0);

      for (let i = pipes.length-1; i >= 0; i--) {
        let p = pipes[i];
        if (p.x + 75 < bird.x && !p.passed) { 
          p.passed = true; 
          score += 10; 
          playSound('coin'); 
        }
        if (bird.x + bird.size - 10 > p.x && bird.x + 10 < p.x + 75) {
          if (bird.y + 10 < p.top || bird.y + bird.size - 10 > p.bottom) {
            gameState = 'gameover';
            createExplosion(bird.x, bird.y);
            playSound('hit');
            lastHitType = (bird.y + 10 < p.top) ? "FUDS" : "JEETS";
            showRestart();
          }
        }
      }

      for (let i = coins.length-1; i >= 0; i--) {
        let c = coins[i];
        if (Math.hypot(bird.x + 32 - c.x, bird.y + 32 - c.y) < 48) {
          score += 10; coins.splice(i,1); playSound('coin');
        }
      }

      if (frame % 420 === 0) speed += 0.20;
    }

    function drawAnimatedBrickPipe(x, y, w, h) {
      ctx.fillStyle = '#e05a2b'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#b53f1a'; ctx.lineWidth = 5;
      const offset = (frame % 40) / 2;
      for (let i = -20; i < h; i += 34) {
        ctx.beginPath(); ctx.moveTo(x, y + i + offset); ctx.lineTo(x + w, y + i + offset); ctx.stroke();
      }
      for (let i = 0; i < w; i += 38) {
        ctx.beginPath(); ctx.moveTo(x + i, y); ctx.lineTo(x + i, y + h); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255, 220, 100, 0.6)'; ctx.lineWidth = 3;
      ctx.strokeRect(x + 6, y + 6, w - 12, h - 12);
    }

    function draw() {
      ctx.fillStyle = '#0b1e3d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawStars();

      ctx.globalAlpha = 0.75;
      if (bgImg.complete) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1.0;

      pipes.forEach(p => {
        drawAnimatedBrickPipe(p.x, 0, 75, p.top);
        drawAnimatedBrickPipe(p.x, p.bottom, 75, canvas.height - p.bottom);

        ctx.fillStyle = '#ffff44'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
        ctx.strokeText('FUDS', p.x + 37, p.top - 22); ctx.fillText('FUDS', p.x + 37, p.top - 22);
        ctx.strokeText('JEETS', p.x + 37, p.bottom + 35); ctx.fillText('JEETS', p.x + 37, p.bottom + 35);
      });

      if (coinImg.complete) coins.forEach(c => ctx.drawImage(coinImg, c.x - 24, c.y - 24, 48, 48));

      if (hotEminImg.complete) {
        ctx.save();
        const cx = bird.x + bird.size/2, cy = bird.y + bird.size/2;
        ctx.translate(cx, cy);
        ctx.rotate(Math.min(Math.max(bird.vel * 0.055, -0.7), 1.1));
        ctx.drawImage(hotEminImg, -bird.size/2, -bird.size/2, bird.size, bird.size);
        ctx.restore();
      }

      particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#111'; ctx.fillRect(0, 540, canvas.width, 60);
      document.getElementById('score').textContent = `Score: ${score} 🪙`;
    }

    function flap() {
      if (gameState === 'playing') {
        bird.vel = flapStrength;
        playSound('flap');
      }
    }

    document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); flap(); } });
    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

    document.getElementById('playBtn').addEventListener('click', () => {
      initAudio();
      startCountdown();
    });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
